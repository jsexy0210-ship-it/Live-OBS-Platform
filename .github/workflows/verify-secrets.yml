name: Verify API keys

# 등록된 API 키가 실제로 동작하는지 읽기 전용·무료 호출로만 확인한다.
# 키 값·응답 본문은 출력하지 않고, 상태 코드와 결과 코드만 출력한다.
on:
  workflow_dispatch:
    inputs:
      corp_num:
        description: 사업자번호 10자리(비우면 Variables의 BAROBILL_CORP_NUM)
        required: false
  pull_request:
    paths:
      - .github/workflows/verify-secrets.yml

permissions:
  contents: read

jobs:
  verify:
    name: Verify API keys
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      NICEPAY_CLIENT_KEY: ${{ secrets.NICEPAY_CLIENT_KEY }}
      NICEPAY_SECRET_KEY: ${{ secrets.NICEPAY_SECRET_KEY }}
      SWEETTRACKER_API_KEY: ${{ secrets.SWEETTRACKER_API_KEY }}
      RESEND_MAIL_API: ${{ secrets.RESEND_MAIL_API }}
      YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
      BAROBILL_API_KEY: ${{ secrets.BAROBILL_API_KEY }}
      NTS_BUSINESS_STATUS_API_KEY: ${{ secrets.NTS_BUSINESS_STATUS_API_KEY }}
      IDENTITY_HASH_KEY: ${{ secrets.IDENTITY_HASH_KEY }}
      BILLING_KEY_SECRET: ${{ secrets.BILLING_KEY_SECRET }}
      PORTONE_API_SECRET: ${{ secrets.PORTONE_API_SECRET }}
      PORTONE_STORE_ID: ${{ secrets.PORTONE_STORE_ID }}
      PORTONE_IDENTITY_CHANNEL_KEY: ${{ secrets.PORTONE_IDENTITY_CHANNEL_KEY }}
      # 사업자번호는 비밀값이 아니라 실행 입력이나 Variables에 둔다. 없으면 가짜 번호로 키 인식 여부만 본다.
      BAROBILL_CORP_NUM: ${{ inputs.corp_num || vars.BAROBILL_CORP_NUM }}
    steps:
      - name: Registered or not
        run: |
          if [ -n "$BAROBILL_CORP_NUM" ] && ! [[ "$BAROBILL_CORP_NUM" =~ ^[0-9]{10}$ ]]; then echo "::error::사업자번호는 숫자 10자리로 넣어 주세요"; exit 1; fi
          for n in NICEPAY_CLIENT_KEY NICEPAY_SECRET_KEY SWEETTRACKER_API_KEY RESEND_MAIL_API YOUTUBE_API_KEY BAROBILL_API_KEY NTS_BUSINESS_STATUS_API_KEY IDENTITY_HASH_KEY BILLING_KEY_SECRET PORTONE_API_SECRET PORTONE_STORE_ID PORTONE_IDENTITY_CHANNEL_KEY; do
            if [ -n "${!n}" ]; then echo "$n: 등록됨"; else echo "$n: 없음"; fi
          done

      - name: NICEPAY (없는 주문 조회, 결제 없음)
        if: ${{ !cancelled() && env.NICEPAY_CLIENT_KEY != '' && env.NICEPAY_SECRET_KEY != '' }}
        run: |
          auth=$(printf '%s:%s' "$NICEPAY_CLIENT_KEY" "$NICEPAY_SECRET_KEY" | base64 -w0)
          ok=0
          for host in sandbox-api.nicepay.co.kr api.nicepay.co.kr; do
            body=$(curl -sS -m 20 -H "Authorization: Basic $auth" "https://$host/v1/payments/find/verify-key-check-0000" -w '\n%{http_code}' || true)
            code=$(printf '%s' "$body" | tail -n1)
            json=$(printf '%s' "$body" | sed '$d')
            rc=$(printf '%s' "$json" | jq -r '.resultCode // "-"' 2>/dev/null)
            echo "$host: HTTP $code, resultCode=$rc, resultMsg=$(printf '%s' "$json" | jq -r '.resultMsg // "-"' 2>/dev/null)"
            [ "$rc" = "U107" ] && { ok=1; echo "  → 이 주소에서 키 인증 성공"; }
          done
          [ "$ok" = 1 ] || { echo "::error::NICEPAY 키 인증 실패"; exit 1; }

      - name: SweetTracker (택배사 목록 조회)
        if: ${{ !cancelled() && env.SWEETTRACKER_API_KEY != '' }}
        run: |
          body=$(curl -sS -m 20 "https://info.sweettracker.co.kr/api/v1/companylist?t_key=$SWEETTRACKER_API_KEY" -w '\n%{http_code}' || true)
          code=$(printf '%s' "$body" | tail -n1); json=$(printf '%s' "$body" | sed '$d')
          n=$(printf '%s' "$json" | jq -r '(.Company // []) | length' 2>/dev/null || echo 0)
          echo "HTTP $code, 택배사 수=$n, status=$(printf '%s' "$json" | jq -r '.status // "-"' 2>/dev/null), msg=$(printf '%s' "$json" | jq -r '.msg // "-"' 2>/dev/null)"
          [ "$code" = 200 ] && [ "${n:-0}" -gt 0 ] || { echo "::error::스마트택배 키 확인 실패"; exit 1; }

      - name: Resend (도메인 목록 조회, 메일 발송 없음)
        if: ${{ !cancelled() && env.RESEND_MAIL_API != '' }}
        run: |
          body=$(curl -sS -m 20 -H "Authorization: Bearer $RESEND_MAIL_API" https://api.resend.com/domains -w '\n%{http_code}' || true)
          code=$(printf '%s' "$body" | tail -n1); json=$(printf '%s' "$body" | sed '$d')
          name=$(printf '%s' "$json" | jq -r '.name // "-"' 2>/dev/null)
          echo "HTTP $code, name=$name, 도메인 수=$(printf '%s' "$json" | jq -r '(.data // []) | length' 2>/dev/null), 인증된 도메인 수=$(printf '%s' "$json" | jq -r '[(.data // [])[] | select(.status=="verified")] | length' 2>/dev/null)"
          # 발송 전용 키는 조회 권한이 없어 restricted_api_key가 오지만, 이는 유효한 키라는 뜻이다
          [ "$code" = 200 ] || [ "$name" = restricted_api_key ] || { echo "::error::Resend 키 확인 실패"; exit 1; }

      - name: YouTube Data API (언어 목록 조회, 할당량 1)
        if: ${{ !cancelled() && env.YOUTUBE_API_KEY != '' }}
        run: |
          body=$(curl -sS -m 20 "https://www.googleapis.com/youtube/v3/i18nLanguages?part=snippet&hl=ko&key=$YOUTUBE_API_KEY" -w '\n%{http_code}' || true)
          code=$(printf '%s' "$body" | tail -n1); json=$(printf '%s' "$body" | sed '$d')
          echo "HTTP $code, 항목 수=$(printf '%s' "$json" | jq -r '(.items // []) | length' 2>/dev/null), error=$(printf '%s' "$json" | jq -r '.error.errors[0].reason // "-"' 2>/dev/null)"
          [ "$code" = 200 ] || { echo "::error::YouTube 키 확인 실패"; exit 1; }

      - name: Barobill (오류 문구 조회, 발행 없음)
        if: ${{ !cancelled() && env.BAROBILL_API_KEY != '' }}
        run: |
          ok=0
          for host in ws.baroservice.com testws.baroservice.com; do
            req="<?xml version=\"1.0\" encoding=\"utf-8\"?><soap:Envelope xmlns:soap=\"http://schemas.xmlsoap.org/soap/envelope/\"><soap:Body><GetBalanceCostAmount xmlns=\"http://ws.baroservice.com/\"><CERTKEY>$BAROBILL_API_KEY</CERTKEY><CorpNum>${BAROBILL_CORP_NUM:-0000000000}</CorpNum></GetBalanceCostAmount></soap:Body></soap:Envelope>"
            body=$(curl -sS -m 20 -H 'Content-Type: text/xml; charset=utf-8' -H 'SOAPAction: "http://ws.baroservice.com/GetBalanceCostAmount"' --data "$req" "https://$host/TI.asmx" -w '\n%{http_code}' || true)
            code=$(printf '%s' "$body" | tail -n1)
            result=$(printf '%s' "$body" | grep -oE '<GetBalanceCostAmountResult>[^<]*' | sed 's/.*>//')
            echo "$host: HTTP $code, 사업자번호 $([ -n "$BAROBILL_CORP_NUM" ] && echo 실제 || echo 가짜), 결과 코드=${result:-'-'}"
            if [ -n "$result" ] && [ "${result#-}" != "$result" ]; then
              req2="<?xml version=\"1.0\" encoding=\"utf-8\"?><soap:Envelope xmlns:soap=\"http://schemas.xmlsoap.org/soap/envelope/\"><soap:Body><GetErrString xmlns=\"http://ws.baroservice.com/\"><CERTKEY>$BAROBILL_API_KEY</CERTKEY><ErrCode>$result</ErrCode></GetErrString></soap:Body></soap:Envelope>"
              msg=$(curl -sS -m 20 -H 'Content-Type: text/xml; charset=utf-8' -H 'SOAPAction: "http://ws.baroservice.com/GetErrString"' --data "$req2" "https://$host/TI.asmx" | grep -oE '<GetErrStringResult>[^<]*' | sed 's/.*>//')
              echo "  오류 뜻: ${msg:-'-'}"
            fi
            # 실제 사업자번호면 0 이상(잔액)이 성공. 가짜 번호면 -10001(인증키는 인식, 연계 사업자 아님)까지 키 인식으로 본다
            if [ -n "$result" ] && [ "${result#-}" = "$result" ]; then ok=1; fi
            if [ -z "$BAROBILL_CORP_NUM" ] && [ "$result" = "-10001" ]; then ok=1; echo "::warning::바로빌 키는 인식됐어요. 실제 사업자번호(vars.BAROBILL_CORP_NUM)로 최종 확인이 필요해요"; fi
          done
          [ "$ok" = 1 ] || { echo "::error::바로빌 키 확인 실패"; exit 1; }

      - name: 국세청 사업자 상태조회 (없는 번호 조회)
        if: ${{ !cancelled() && env.NTS_BUSINESS_STATUS_API_KEY != '' }}
        run: |
          key=$(printf '%s' "$NTS_BUSINESS_STATUS_API_KEY" | jq -sRr @uri)
          body=$(curl -sS -m 20 -H 'Content-Type: application/json' --data "{\"b_no\":[\"${BAROBILL_CORP_NUM:-0000000000}\"]}" "https://api.odcloud.kr/api/nts-businessman/v1/status?serviceKey=$key" -w '\n%{http_code}' || true)
          code=$(printf '%s' "$body" | tail -n1); json=$(printf '%s' "$body" | sed '$d')
          echo "인코딩 그대로: HTTP $code, status_code=$(printf '%s' "$json" | jq -r '.status_code // "-"' 2>/dev/null), match_cnt=$(printf '%s' "$json" | jq -r '.match_cnt // "-"' 2>/dev/null), msg=$(printf '%s' "$json" | jq -r '.msg // .data[0].tax_type // "-"' 2>/dev/null)"
          body=$(curl -sS -m 20 -H 'Content-Type: application/json' --data "{\"b_no\":[\"${BAROBILL_CORP_NUM:-0000000000}\"]}" "https://api.odcloud.kr/api/nts-businessman/v1/status?serviceKey=$NTS_BUSINESS_STATUS_API_KEY" -w '\n%{http_code}' || true)
          code=$(printf '%s' "$body" | tail -n1); json=$(printf '%s' "$body" | sed '$d')
          sc=$(printf '%s' "$json" | jq -r '.status_code // "-"' 2>/dev/null)
          echo "원문 그대로: HTTP $code, status_code=$sc, msg=$(printf '%s' "$json" | jq -r '.msg // .data[0].tax_type // "-"' 2>/dev/null)"
          [ "$sc" = OK ] || { echo "::error::국세청 키 확인 실패(원문 그대로 사용 기준)"; exit 1; }

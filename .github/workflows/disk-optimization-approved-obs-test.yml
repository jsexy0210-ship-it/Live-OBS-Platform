# 승인된 두 범주만. 앱의 execution 승인·활성 세션·원자 claim 없이는 실행하지 않는다.
name: Disk optimization approved obs-test
run-name: MA120 EXECUTE ${{ inputs.request_id }}
on:
  workflow_dispatch:
    inputs:
      request_id:
        description: App-issued request UUID
        required: true
        type: string
      candidate_fingerprint:
        description: Exact server-issued candidate fingerprint
        required: true
        type: string
      preview_expires_at:
        description: Server-issued preview expiry
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: deploy-obs-test
  cancel-in-progress: false
jobs:
  approved:
    if: github.ref == 'refs/heads/main' && github.repository == 'jsexy0210-ship-it/Live-OBS-Platform'
    runs-on: [self-hosted, obs-kakao]
    environment: obs-test
    timeout-minutes: 15
    steps:
      - name: Verify isolated checkout path
        id: isolated_checkout
        shell: bash
        run: |
          set -euo pipefail
          workspace="$(realpath -e -- "${GITHUB_WORKSPACE:?}")"
          [[ -d "$workspace" && "$workspace" != / ]] || { echo "GITHUB_WORKSPACE 확인 실패" >&2; exit 1; }
          checkout_name="disk-optimization-approved-${GITHUB_RUN_ID:?}-${GITHUB_RUN_ATTEMPT:?}"
          [[ "$checkout_name" =~ ^disk-optimization-approved-[0-9]+-[0-9]+$ ]] || { echo "진단 checkout 이름이 안전하지 않아요" >&2; exit 1; }
          target="${workspace%/}/$checkout_name"
          resolved="$(realpath -m -- "$target")"
          workspace_prefix="${workspace%/}/"
          [[ "$resolved" == "$workspace_prefix"* ]] || { echo "진단 checkout 경로가 workspace 밖이에요" >&2; exit 1; }
          if [[ -e "$target" || -L "$target" ]]; then
            echo "진단 checkout 경로가 이미 있어 기존 runner 자료를 보존합니다" >&2
            exit 1
          fi
          if ! mkdir -- "$target"; then
            echo "진단 checkout 경로를 독점할 수 없어 기존 runner 자료를 보존합니다" >&2
            exit 1
          fi
          target_real="$(realpath -e -- "$target")"
          [[ "$target_real" == "$target" ]] || { echo "진단 checkout 경로가 안전하지 않아요" >&2; exit 1; }
          printf 'checkout_path=%s\n' "$checkout_name" >> "$GITHUB_OUTPUT"

      - name: Checkout
        id: checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          path: ${{ steps.isolated_checkout.outputs.checkout_path }}
          clean: false
          persist-credentials: false

      - name: Claim and process approved candidates
        working-directory: ${{ github.workspace }}/${{ steps.isolated_checkout.outputs.checkout_path }}
        env:
          DISK_REQUEST_ID: ${{ inputs.request_id }}
          DISK_FINGERPRINT: ${{ inputs.candidate_fingerprint }}
          DISK_PREVIEW_EXPIRES_AT: ${{ inputs.preview_expires_at }}
          ONQ_DISK_CALLBACK_TOKEN: ${{ secrets.ONQ_DISK_CALLBACK_TOKEN }}
          ONQ_DISK_EXECUTION_APPROVED: ${{ vars.ONQ_DISK_EXECUTION_APPROVED }}
        run: |
          set -euo pipefail
          export OBS_RUNNER_ROOT="$(dirname -- "$(dirname -- "${RUNNER_TEMP:?}")")"
          python3 scripts/ops/disk-optimization-runner.py --approved-execution

# obs-test 서버(obs-web-test) 디스크 점검·정리. 절차: docs/DEPLOY.md 「디스크 정리」
# - 수동 실행(workflow_dispatch)만. main과 이 저장소일 때만 돈다.
# - mode=list: 지울 후보만 보여 준다(아무것도 지우지 않음). 결과는 실행 요약의 알림(annotation)으로 남는다.
# - mode=apply: scripts/ops/disk-cleanup.sh --apply 로 정리한다. list로 후보를 확인한 뒤에만 실행한다.
# - 정리 대상은 스크립트에 정한 네 가지뿐이다(오래된 배포 전 자동 백업·옛 앱 이미지·오래된 빌드 캐시·오래된 러너 로그).
#   DB 볼륨·수동 백업·컨테이너·최근 5개 버전 이미지는 지우지 않는다.
name: Disk cleanup obs-test

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "list = 지울 후보만 보기, apply = 정리하기(list로 먼저 확인)"
        required: true
        default: list
        type: choice
        options:
          - list
          - apply
      builder_keep_h:
        description: "빌드 캐시를 마지막으로 쓴 지 몇 시간 넘은 것만 지울지(기본 24). 빌드 캐시는 지워도 다음 빌드가 느려질 뿐 데이터 손실은 없어요."
        required: false
        default: "24"
        type: choice
        options:
          - "24"
          - "6"
          - "1"
      image_keep:
        description: "보관할 최근 앱 버전 이미지 개수(기본 5). 디스크가 모자라면 3으로 줄여 오래된 버전 이미지를 지워요. 줄이면 그만큼 되돌릴 수 있는 이전 버전이 줄어요(실행 중 버전은 항상 남아요)."
        required: false
        default: "5"
        type: choice
        options:
          - "5"
          - "3"
          - "2"
      include_readonly_details:
        description: "읽기 전용 공간·BuildKit 진단을 포함(list 전용, 삭제 없음)"
        required: false
        default: false
        type: boolean
      include_onq_checkout_artifact_details:
        description: "ONQ checkout의 .next/node_modules 고정 경로 상태만 조회(list 전용, Buildx cache 조회·삭제 없음)"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: deploy-obs-test
  cancel-in-progress: false

jobs:
  cleanup:
    name: Disk cleanup (${{ inputs.mode }})
    if: github.ref == 'refs/heads/main' && github.repository == 'jsexy0210-ship-it/Live-OBS-Platform'
    runs-on: [self-hosted, obs-kakao]
    environment: obs-test
    timeout-minutes: 15
    steps:
      - name: Verify isolated checkout path
        id: isolated_checkout
        shell: bash
        run: |
          set -euo pipefail
          workspace="$(realpath -e -- "${GITHUB_WORKSPACE:?}")"
          [[ -d "$workspace" && "$workspace" != / ]] || { echo "GITHUB_WORKSPACE 확인 실패" >&2; exit 1; }
          checkout_name="disk-cleanup-${GITHUB_RUN_ID:?}-${GITHUB_RUN_ATTEMPT:?}"
          [[ "$checkout_name" =~ ^disk-cleanup-[0-9]+-[0-9]+$ ]] || { echo "진단 checkout 이름이 안전하지 않아요" >&2; exit 1; }
          target="${workspace%/}/$checkout_name"
          resolved="$(realpath -m -- "$target")"
          workspace_prefix="${workspace%/}/"
          [[ "$resolved" == "$workspace_prefix"* ]] || { echo "진단 checkout 경로가 workspace 밖이에요" >&2; exit 1; }
          if [[ -e "$target" || -L "$target" ]]; then
            echo "진단 checkout 경로가 이미 있어 기존 runner 자료를 보존합니다" >&2
            exit 1
          fi
          if ! mkdir -- "$target"; then
            echo "진단 checkout 경로를 독점할 수 없어 기존 runner 자료를 보존합니다" >&2
            exit 1
          fi
          target_real="$(realpath -e -- "$target")"
          [[ "$target_real" == "$target" ]] || { echo "진단 checkout 경로가 안전하지 않아요" >&2; exit 1; }
          printf 'checkout_path=%s\n' "$checkout_name" >> "$GITHUB_OUTPUT"

      - name: Checkout
        id: checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          path: ${{ steps.isolated_checkout.outputs.checkout_path }}
          clean: false
          persist-credentials: false

      # 로그를 열지 못하는 환경에서도 결과를 볼 수 있게 출력 전체를 알림 한 건으로 남긴다.
      # run 기본 셸은 bash -e 이므로 실패 코드는 `|| code=$?`로 받는다. 용량 점검 단계는 정보용이라 실패로 끝내지 않는다.
      - name: Disk check (before)
        working-directory: ${{ github.workspace }}/${{ steps.isolated_checkout.outputs.checkout_path }}
        run: |
          set -uo pipefail
          code=0; out="$(OBS_MIN_FREE_GB=5 scripts/ops/disk-cleanup.sh --check 2>&1)" || code=$?
          printf '%s\n' "$out"
          msg="${out//'%'/'%25'}"; msg="${msg//$'\r'/'%0D'}"; msg="${msg//$'\n'/'%0A'}"
          echo "::notice title=disk before (exit ${code})::${msg}"

      - name: Cleanup (${{ inputs.mode }})
        working-directory: ${{ github.workspace }}/${{ steps.isolated_checkout.outputs.checkout_path }}
        env:
          MODE: ${{ inputs.mode }}
          OBS_BUILDER_KEEP_H: ${{ inputs.builder_keep_h }}
          OBS_IMAGE_KEEP: ${{ inputs.image_keep }}
          INCLUDE_READONLY_DETAILS: ${{ inputs.include_readonly_details }}
          INCLUDE_ONQ_CHECKOUT_ARTIFACT_DETAILS: ${{ inputs.include_onq_checkout_artifact_details }}
        run: |
          set -uo pipefail
          if [ "$MODE" = apply ]; then args=(--apply); elif [ "$INCLUDE_ONQ_CHECKOUT_ARTIFACT_DETAILS" = true ]; then args=(--checkout-details); elif [ "$INCLUDE_READONLY_DETAILS" = true ]; then args=(--details); else args=(); fi
          code=0; out="$(scripts/ops/disk-cleanup.sh "${args[@]}" 2>&1)" || code=$?
          printf '%s\n' "$out"
          msg="${out//'%'/'%25'}"; msg="${msg//$'\r'/'%0D'}"; msg="${msg//$'\n'/'%0A'}"
          echo "::notice title=disk-cleanup ${MODE} (exit ${code})::${msg}"
          exit "$code"

      - name: Disk check (after)
        if: always() && steps.checkout.outcome == 'success'
        working-directory: ${{ github.workspace }}/${{ steps.isolated_checkout.outputs.checkout_path }}
        run: |
          set -uo pipefail
          code=0; out="$(OBS_MIN_FREE_GB=5 scripts/ops/disk-cleanup.sh --check 2>&1)" || code=$?
          printf '%s\n' "$out"
          msg="${out//'%'/'%25'}"; msg="${msg//$'\r'/'%0D'}"; msg="${msg//$'\n'/'%0A'}"
          echo "::notice title=disk after (exit ${code})::${msg}"

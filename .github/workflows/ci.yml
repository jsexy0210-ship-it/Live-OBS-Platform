name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Typecheck and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Validate deployment policy
        run: |
          python3 -m pip install 'PyYAML==6.0.2'
          python3 scripts/infra/check_workflows.py
          python3 -m unittest discover -s tests/infra -v
      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install
        run: npm ci --no-audit --no-fund
      - name: Typecheck
        run: npm run typecheck
      - name: Build
        run: npm run build

  test:
    name: Unit and integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: live_obs
          POSTGRES_PASSWORD: live_obs
          POSTGRES_DB: live_obs_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U live_obs -d live_obs_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # 폐기용 GitHub Actions DB. VM에서 재사용하지 않는다.
      DATABASE_URL: postgresql://live_obs:live_obs@localhost:5432/live_obs_test
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install
        run: npm ci --no-audit --no-fund
      - name: Unit tests
        run: npm test
      - name: Migrate test DB
        run: npm run db:migrate
      - name: Integration tests
        run: npm run test:integration

  docker-smoke:
    name: Full Docker build and disposable deployment smoke
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      APP_VERSION: ${{ github.sha }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - run: bash scripts/infra/ci_smoke.sh

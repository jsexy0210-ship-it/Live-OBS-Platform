name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: lifeleft-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static-build:
    name: Typecheck and static export
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install
        run: npm install --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      - name: Static export
        run: npm run build

      - name: Verify output
        run: |
          test -f out/index.html
          test -f out/subscriptions/index.html
          test -f out/survival/index.html

name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Typecheck and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: No deploy workflows
        run: |
          set -euo pipefail
          # self-hosted 러너는 obs-test 수동 배포(deploy-obs-test.yml, 대표님 승인 2026-10-03, 이슈 #137)와
          # obs-test 시험 데이터(seed-obs-test.yml, 대표님 승인 2026-10-04)만 허용한다.
          # 그 밖의 워크플로가 self-hosted를 쓰면 실패한다.
          # `! cmd`는 set -e에서 실패로 잡히지 않으므로 if로 멈춘다
          if grep -RIl 'self-hosted' .github/workflows/ --exclude=ci.yml --exclude=deploy-obs-test.yml --exclude=seed-obs-test.yml; then exit 1; fi
          for f in .github/workflows/deploy-obs-test.yml .github/workflows/seed-obs-test.yml; do
            [ -f "$f" ] || continue
            # 수동 실행 전용: workflow_dispatch 말고 다른 트리거가 있으면 실패
            if grep -Eq '^[[:space:]]*(push|pull_request|pull_request_target|schedule|workflow_run|workflow_call|repository_dispatch|issue_comment|issues|release|merge_group)[[:space:]]*:' "$f"; then echo "$f: 수동 실행 말고 다른 트리거가 있어요"; exit 1; fi
            grep -q '^  workflow_dispatch:' "$f"
            # main·이 저장소일 때만 job 실행, Environment obs-test로 묶기
            grep -Fq "if: github.ref == 'refs/heads/main' && github.repository == 'jsexy0210-ship-it/Live-OBS-Platform'" "$f"
            grep -q '^    environment: obs-test$' "$f"
          done

      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install
        run: npm ci --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

  test:
    name: Unit and integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      # 폐기 가능한 테스트 DB (GitHub Actions 서비스 컨테이너, 외부 자원 없음)
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: live_obs
          POSTGRES_PASSWORD: live_obs
          POSTGRES_DB: live_obs_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U live_obs -d live_obs_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://live_obs:live_obs@localhost:5432/live_obs_test
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install
        run: npm ci --no-audit --no-fund

      - name: Unit tests
        run: npm test

      - name: Migrate test DB
        run: npm run db:migrate

      - name: Integration tests
        run: npm run test:integration

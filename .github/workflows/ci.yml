name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Typecheck and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: No deploy workflows
        run: |
          set -euo pipefail
          # self-hosted 러너는 obs-test 수동 배포(deploy-obs-test.yml, 대표님 승인 2026-10-03, 이슈 #137)와
          # obs-test 시험 데이터(seed-obs-test.yml, 대표님 승인 2026-10-04), 운영 수동 배포(deploy-obs-prod.yml, 대표님 승인 2026-10-05),
          # obs-test 디스크 점검·정리(disk-cleanup-obs-test.yml, 대표님 지시 2026-10-06)만 허용한다.
          # 그 밖의 워크플로가 self-hosted를 쓰면 실패한다.
          # `! cmd`는 set -e에서 실패로 잡히지 않으므로 if로 멈춘다
          if grep -RIl 'self-hosted' .github/workflows/ --exclude=ci.yml --exclude=deploy-obs-test.yml --exclude=seed-obs-test.yml --exclude=deploy-obs-prod.yml --exclude=disk-cleanup-obs-test.yml; then exit 1; fi
          for f in .github/workflows/deploy-obs-test.yml .github/workflows/seed-obs-test.yml .github/workflows/disk-cleanup-obs-test.yml; do
            [ -f "$f" ] || continue
            # 수동 실행 전용: workflow_dispatch 말고 다른 트리거가 있으면 실패
            if grep -Eq '^[[:space:]]*(push|pull_request|pull_request_target|schedule|workflow_run|workflow_call|repository_dispatch|issue_comment|issues|release|merge_group)[[:space:]]*:' "$f"; then echo "$f: 수동 실행 말고 다른 트리거가 있어요"; exit 1; fi
            grep -q '^  workflow_dispatch:' "$f"
            # main·이 저장소일 때만 job 실행, Environment obs-test로 묶기
            grep -Fq "if: github.ref == 'refs/heads/main' && github.repository == 'jsexy0210-ship-it/Live-OBS-Platform'" "$f"
            grep -q '^    environment: obs-test$' "$f"
          done
          # 운영 배포는 같은 조건에 더해 Environment production(Required reviewer)과 운영 전용 러너 라벨 obs-prod로만 돈다.
          f=.github/workflows/deploy-obs-prod.yml
          if [ -f "$f" ]; then
            if grep -Eq '^[[:space:]]*(push|pull_request|pull_request_target|schedule|workflow_run|workflow_call|repository_dispatch|issue_comment|issues|release|merge_group)[[:space:]]*:' "$f"; then echo "$f: 수동 실행 말고 다른 트리거가 있어요"; exit 1; fi
            grep -q '^  workflow_dispatch:' "$f"
            grep -Fq "if: github.ref == 'refs/heads/main' && github.repository == 'jsexy0210-ship-it/Live-OBS-Platform'" "$f"
            grep -q '^    environment: production$' "$f"
            grep -q '^    runs-on: \[self-hosted, obs-prod\]$' "$f"
          fi

      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install
        run: npm ci --no-audit --no-fund

      - name: Design map check
        run: npm run design:check

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

  test:
    name: Unit and integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      # 폐기 가능한 테스트 DB (GitHub Actions 서비스 컨테이너, 외부 자원 없음)
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: live_obs
          POSTGRES_PASSWORD: live_obs
          POSTGRES_DB: live_obs_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U live_obs -d live_obs_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://live_obs:live_obs@localhost:5432/live_obs_test
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install
        run: npm ci --no-audit --no-fund

      - name: Unit tests
        run: npm test

      - name: Migrate test DB
        run: npm run db:migrate

      - name: Integration tests
        run: npm run test:integration

  # PR용 e2e 스모크(대표님 승인 MASTER 결정 2026-10-05). 핵심 화면 몇 개만 실제 브라우저로 확인한다.
  # 폐기용 DB(서비스 컨테이너)에 migrate → 데모 데이터 → build → next start → playwright. 외부 자원·비밀값 없음.
  # 문서 전용 변경(docs/ 또는 루트 *.md만)이면 단계를 건너뛰고 성공으로 끝난다(필수 체크로 걸어도 막히지 않게 작업 자체는 항상 돈다).
  # 전체 e2e는 야간 별도 워크플로로 둔다. 스모크 spec 목록은 아래 SMOKE_SPECS에서 고친다.
  e2e-smoke:
    name: E2E smoke
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: live_obs
          POSTGRES_PASSWORD: live_obs
          POSTGRES_DB: live_obs_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U live_obs -d live_obs_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://live_obs:live_obs@localhost:5432/live_obs_test
      SMOKE_SPECS: admin-shell layout-admin-login login-tabs partners-auth admin-dashboard public-notices public-info seller-deposits seller-products seller-members seller-reviews-title seller-stats seller-broadcast seller-shop-legal shop-content shop-detail-board admin-ops
      # 방송·채팅 스모크는 실제 YouTube 호출 없이 임의 키와 스케줄러 중지로 실행한다.
      YOUTUBE_API_KEY: e2e-dummy
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Docs-only check
        id: gate
        env:
          EVENT: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          skip=false
          if [ "$EVENT" = "pull_request" ]; then
            files="$(git diff --name-only "origin/$BASE_REF"...HEAD)"
            if [ -n "$files" ] && ! printf '%s\n' "$files" | grep -Evq '^(docs/|[^/]+\.md$)'; then skip=true; fi
          fi
          echo "skip=$skip" >> "$GITHUB_OUTPUT"
          if [ "$skip" = true ]; then echo "문서 전용 변경이라 e2e 스모크를 건너뜁니다."; fi

      - name: Node
        if: steps.gate.outputs.skip != 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install
        if: steps.gate.outputs.skip != 'true'
        run: npm ci --no-audit --no-fund

      - name: Install browser
        if: steps.gate.outputs.skip != 'true'
        run: npx playwright install --with-deps chromium

      - name: Migrate and seed test DB
        if: steps.gate.outputs.skip != 'true'
        run: |
          set -euo pipefail
          pw="$(openssl rand -hex 12)"
          echo "::add-mask::$pw"
          echo "E2E_PASSWORD=$pw" >> "$GITHUB_ENV"
          npm run db:migrate
          DEV_SEED_PASSWORD="$pw" node scripts/dev-seed.mjs > /dev/null

      - name: Build
        if: steps.gate.outputs.skip != 'true'
        run: npm run build

      - name: Start app
        if: steps.gate.outputs.skip != 'true'
        run: |
          set -euo pipefail
          SCHEDULER_DISABLED=1 nohup npx next start -p 3100 > "$RUNNER_TEMP/next.log" 2>&1 &
          for i in $(seq 1 60); do
            curl -sf -o /dev/null http://localhost:3100/ && exit 0
            sleep 1
          done
          echo "앱이 60초 안에 뜨지 않았어요."; tail -n 50 "$RUNNER_TEMP/next.log"; exit 1

      - name: E2E smoke
        if: steps.gate.outputs.skip != 'true'
        env:
          E2E_SCREENSHOTS: "1"
        run: npx playwright test -c tests/e2e/playwright.config.ts --project=start $SMOKE_SPECS

      - name: Upload branch screenshots
        if: always() && steps.gate.outputs.skip != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: sa-body-branch-screenshots
          path: tests/e2e/screenshots/*.png
          if-no-files-found: ignore
          retention-days: 1

      - name: App log on failure
        if: failure() && steps.gate.outputs.skip != 'true'
        run: tail -n 100 "$RUNNER_TEMP/next.log" || true

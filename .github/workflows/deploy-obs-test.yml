# obs-test 서버(obs-web-test) 배포. 절차·runner 등록: docs/DEPLOY.md
# - 수동 실행(workflow_dispatch)만. PR·push·예약 실행 없음.
# - main 브랜치와 이 저장소일 때만 job이 돈다. fork·다른 브랜치는 runner로 가지 않는다.
# - VM 안의 self-hosted runner(라벨 obs-kakao)가 main을 받아 VM에서 이미지를 빌드·기동한다.
# - 비밀값은 서버의 /opt/obs/.env에만 있다. 이 파일과 로그에 넣지 않는다.
name: Deploy obs-test

on:
  workflow_dispatch:
    inputs:
      confirm_sha:
        description: "배포할 main 커밋 SHA(앞 7자리 이상). 실행 시점의 main과 다르면 멈춰요."
        required: true
        type: string
      check_image_bucket:
        description: "배포 뒤 이미지 버킷 연결을 확인해요(목록 조회 1회, 쓰기 없음). 켜지 않으면 확인하지 않아요."
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: deploy-obs-test
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to obs-test
    if: github.ref == 'refs/heads/main' && github.repository == 'jsexy0210-ship-it/Live-OBS-Platform'
    runs-on: [self-hosted, obs-kakao]
    environment: obs-test
    timeout-minutes: 40
    env:
      ENV_FILE: /opt/obs/.env
      BACKUP_DIR: /opt/obs/backups
      CONFIRM_SHA: ${{ inputs.confirm_sha }}
    steps:
      - name: Check target commit
        run: |
          set -euo pipefail
          if [ "${#CONFIRM_SHA}" -lt 7 ] || ! printf '%s' "$CONFIRM_SHA" | grep -Eq '^[0-9a-f]+$'; then
            echo "커밋 SHA를 7자리 이상 소문자 16진수로 입력해 주세요."; exit 1
          fi
          case "$GITHUB_SHA" in
            "$CONFIRM_SHA"*) echo "배포 커밋: $GITHUB_SHA" ;;
            *) echo "입력한 SHA($CONFIRM_SHA)가 실행 시점의 main($GITHUB_SHA)과 달라요."; exit 1 ;;
          esac
          test -f "$ENV_FILE" || { echo "$ENV_FILE 이 없어요(docs/DEPLOY.md 「서버 .env」)."; exit 1; }

      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      # 디스크가 모자라면 빌드 도중 죽지 않게 여기서 먼저 멈춘다(docs/DEPLOY.md 「디스크 정리」).
      - name: Check disk space
        env:
          OBS_MIN_FREE_GB: "5"
        run: scripts/ops/disk-cleanup.sh --check

      # 서버 감시가 배포 중 거짓 장애 알림을 내지 않게 배포 진행 표시를 둔다(docs/DEPLOY.md 「서버 감시」).
      # 표시가 실패해도 배포는 막지 않는다: flock이 없거나 표시를 못 만들면 경고만 남긴다.
      - name: Mark deploying (monitor)
        env:
          MARK_KEY: workflow-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          if ! command -v flock >/dev/null 2>&1; then
            echo "::warning::flock이 없어 배포 진행 표시를 건너뛰어요. 배포 중 감시가 장애로 알릴 수 있어요."
          elif ! scripts/ops/deploy-mark.sh on "$MARK_KEY" "deploy-obs-test ${GITHUB_SHA:0:7}"; then
            echo "::warning::배포 진행 표시를 켜지 못했어요. 배포 중 감시가 장애로 알릴 수 있어요."
          fi

      - name: Backup DB before deploy
        run: |
          set -euo pipefail
          # 이번 배포의 compose 정의로 DB를 다시 만들지 않도록, 지금 있는 DB 컨테이너를 그대로 깨워 백업한다
          # (새 정의로 up 하면 이미지·볼륨 변경이 백업보다 먼저 적용될 수 있음)
          db="$(docker ps -aq --filter label=com.docker.compose.project=obs-web --filter label=com.docker.compose.service=obs-web-db | head -n1)"
          if [ -n "$db" ]; then
            docker start "$db" >/dev/null
            for i in $(seq 1 30); do
              docker exec "$db" sh -c 'pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"' >/dev/null 2>&1 && break
              [ "$i" -eq 30 ] && { echo "DB가 준비되지 않아 백업하지 못했어요. 배포를 멈춰요."; exit 1; }
              sleep 2
            done
            f="$BACKUP_DIR/obs-$(TZ=Asia/Seoul date +%Y%m%d-%H%M%S)-before-${GITHUB_SHA:0:7}.dump"
            # 중간에 실패해도 잘린 파일이 정상 백업 이름으로 남지 않게 .part에 먼저 쓴다
            if ! docker exec "$db" sh -c 'pg_dump -U "$POSTGRES_USER" -d "$POSTGRES_DB" -Fc' > "$f.part"; then
              rm -f "$f.part"; echo "백업에 실패해 배포를 멈춰요."; exit 1
            fi
            chmod 600 "$f.part"
            mv "$f.part" "$f"
            echo "백업: $(basename "$f")"
          elif docker volume inspect obs-web_obs-web-pgdata >/dev/null 2>&1; then
            echo "DB 볼륨은 있는데 DB 컨테이너가 없어요. docs/DEPLOY.md 「백업·복구」로 수동 백업한 뒤 다시 실행해 주세요."
            exit 1
          else
            echo "DB 볼륨이 아직 없어 백업을 건너뛰어요(첫 배포)."
          fi

      # 이미지 서버(카카오 Object Storage) 설정을 서버 .env에 반영한다(docs/DEPLOY.md 「이미지 서버」).
      # - 키 값은 GitHub Secrets(KAKAO_S3_ACCESS_KEY·KAKAO_S3_SECRET_KEY)에서만 와요. 로그에 찍지 않아요(set -x 금지, 값을 echo하지 않음).
      # - .env의 다른 줄은 그대로 두고, 임시 파일에 만든 뒤 한 번에 바꿔요(중간에 실패해도 기존 .env가 남아요).
      # - IMAGE_STORAGE는 없을 때만 db로 넣어요. 이미 있으면(대표님이 서버에서 바꾼 값) 덮어쓰지 않아요. 카카오 전환은 이 단계가 하지 않아요.
      # - 이 단계가 실패해도 배포는 막지 않아요(기본 저장소는 DB라 영향 없음).
      - name: Sync image storage env
        continue-on-error: true
        env:
          KAKAO_S3_ACCESS_KEY: ${{ secrets.KAKAO_S3_ACCESS_KEY }}
          KAKAO_S3_SECRET_KEY: ${{ secrets.KAKAO_S3_SECRET_KEY }}
          IMAGE_S3_ENDPOINT: https://objectstorage.kr-central-2.kakaocloud.com
          IMAGE_S3_REGION: kr-central-2
          IMAGE_S3_BUCKET: live-obs-platform
        run: |
          set -euo pipefail
          umask 077
          ak="${KAKAO_S3_ACCESS_KEY:-}"; sk="${KAKAO_S3_SECRET_KEY:-}"
          [ -z "$ak" ] || echo "::add-mask::$ak"
          [ -z "$sk" ] || echo "::add-mask::$sk"
          if [ ! -f "$ENV_FILE" ]; then
            echo "::warning::$ENV_FILE 이 없어 이미지 저장소 설정을 건너뛰어요."; exit 0
          fi
          safe='^[A-Za-z0-9._/+=-]+$'   # .env(compose env_file)에 따옴표·공백·$·# 없이 그대로 쓸 수 있는 문자만
          have_keys=0
          if [ -n "$ak" ] && [ -n "$sk" ]; then
            if [[ "$ak" =~ $safe && "$sk" =~ $safe ]]; then
              have_keys=1
            else
              echo "::warning::KAKAO_S3_* Secret에 .env에 그대로 쓸 수 없는 문자(공백·따옴표·\$·# 등)가 있어 키는 넣지 않아요."
            fi
          else
            echo "::notice::KAKAO_S3_* Secret이 비어 있어 키는 넣지 않아요."
          fi
          has_storage=0
          grep -Eq '^[[:space:]]*(export[[:space:]]+)?IMAGE_STORAGE[[:space:]]*=' "$ENV_FILE" && has_storage=1 || true
          tmp="$(mktemp "$(dirname "$ENV_FILE")/.env.XXXXXX")"
          trap 'rm -f "$tmp"' EXIT
          if [ "$have_keys" = 1 ]; then
            # 키가 있을 때만 IMAGE_S3_* 줄을 새 값으로 바꾼다(다른 줄은 그대로)
            grep -Ev '^[[:space:]]*(export[[:space:]]+)?IMAGE_S3_[A-Z_]*[[:space:]]*=' "$ENV_FILE" > "$tmp" || true
          else
            cat "$ENV_FILE" > "$tmp"
          fi
          if [ -s "$tmp" ] && [ -n "$(tail -c1 "$tmp")" ]; then echo >> "$tmp"; fi
          {
            [ "$has_storage" = 1 ] || echo "IMAGE_STORAGE=db"
            if [ "$have_keys" = 1 ]; then
              echo "IMAGE_S3_ENDPOINT=$IMAGE_S3_ENDPOINT"
              echo "IMAGE_S3_REGION=$IMAGE_S3_REGION"
              echo "IMAGE_S3_BUCKET=$IMAGE_S3_BUCKET"
              printf 'IMAGE_S3_ACCESS_KEY_ID=%s\n' "$ak"
              printf 'IMAGE_S3_SECRET_ACCESS_KEY=%s\n' "$sk"
            fi
          } >> "$tmp"
          chmod 600 "$tmp"
          if cmp -s "$tmp" "$ENV_FILE"; then
            echo "이미지 저장소 설정: 바뀐 것 없음"
          else
            mv -f "$tmp" "$ENV_FILE"
            echo "이미지 저장소 설정을 .env에 반영했어요(키 $([ "$have_keys" = 1 ] && echo 넣음 || echo 그대로))."
          fi
          cur="$(sed -n 's/^[[:space:]]*\(export[[:space:]]\+\)\?IMAGE_STORAGE[[:space:]]*=[[:space:]]*//p' "$ENV_FILE" | tail -n1)"
          echo "IMAGE_STORAGE 현재 값: ${cur:-없음}"

      # 나이스페이 샌드박스 키·YouTube API 키를 GitHub Secrets에서 .env로 옮긴다(테스트 서버 전용, 값은 출력하지 않는다).
      # 키마다 따로 판단한다: Secret이 비었거나 .env에 그대로 쓸 수 없는 문자가 있으면 그 키는 넣지 않고 .env의 기존 줄을 그대로 둔다.
      # 나이스페이는 코드가 샌드박스 주소만 불러 운영 결제가 나갈 수 없다(lib/server/payments/nicepay.ts).
      - name: Sync payment and YouTube env
        continue-on-error: true
        env:
          NICEPAY_CLIENT_KEY: ${{ secrets.NICEPAY_CLIENT_KEY }}
          NICEPAY_SECRET_KEY: ${{ secrets.NICEPAY_SECRET_KEY }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          set -euo pipefail
          umask 077
          if [ ! -f "$ENV_FILE" ]; then
            echo "::warning::$ENV_FILE 이 없어 키 설정을 건너뛰어요."; exit 0
          fi
          safe='^[A-Za-z0-9._/+=-]+$'
          tmp="$(mktemp "$(dirname "$ENV_FILE")/.env.XXXXXX")"
          trap 'rm -f "$tmp"' EXIT
          cat "$ENV_FILE" > "$tmp"
          if [ -s "$tmp" ] && [ -n "$(tail -c1 "$tmp")" ]; then echo >> "$tmp"; fi
          # 나이스페이는 두 값이 모두 있을 때만 넣는다(하나만 바꾸면 짝이 맞지 않는다).
          put=()
          if [ -n "${NICEPAY_CLIENT_KEY:-}" ] && [ -n "${NICEPAY_SECRET_KEY:-}" ]; then
            put+=(NICEPAY_CLIENT_KEY NICEPAY_SECRET_KEY)
          else
            echo "::notice::NICEPAY_* Secret이 비어 있어 나이스페이 설정은 그대로 둬요."
          fi
          if [ -n "${YOUTUBE_API_KEY:-}" ]; then put+=(YOUTUBE_API_KEY); else echo "::notice::YOUTUBE_API_KEY Secret이 비어 있어 그대로 둬요."; fi
          if [ -n "${GEMINI_API_KEY:-}" ]; then put+=(GEMINI_API_KEY); else echo "::notice::GEMINI_API_KEY Secret이 비어 있어 그대로 둬요."; fi
          for n in "${put[@]}"; do
            v="${!n}"
            echo "::add-mask::$v"
            if ! [[ "$v" =~ $safe ]]; then
              echo "::warning::$n Secret에 .env에 그대로 쓸 수 없는 문자(공백·따옴표·\$·# 등)가 있어 이 단계의 키를 모두 넣지 않아요."; exit 0
            fi
          done
          for n in "${put[@]}"; do
            grep -Ev "^[[:space:]]*(export[[:space:]]+)?${n}[[:space:]]*=" "$tmp" > "$tmp.n" || true
            mv -f "$tmp.n" "$tmp"
            printf '%s=%s\n' "$n" "${!n}" >> "$tmp"
          done
          chmod 600 "$tmp"
          if cmp -s "$tmp" "$ENV_FILE"; then
            echo "키 설정: 바뀐 것 없음"
          else
            mv -f "$tmp" "$ENV_FILE"
            echo "키를 .env에 반영했어요: ${put[*]:-없음}(이름만 표시)."
          fi

      - name: Build and start
        env:
          APP_VERSION: ${{ github.sha }}
          OBS_ENV_FILE: /opt/obs/.env
        run: |
          set -euo pipefail
          docker compose -p obs-web -f deploy/docker-compose.yml --env-file "$ENV_FILE" up -d --build --wait --wait-timeout 600

      - name: Health check
        run: |
          set -euo pipefail
          for i in $(seq 1 30); do
            body="$(curl -fsS --max-time 5 http://127.0.0.1/api/health || true)"
            if printf '%s' "$body" | grep -q "\"version\":\"$GITHUB_SHA\"" && printf '%s' "$body" | grep -q '"db":"ok"'; then
              echo "health ok: $body"; break
            fi
            if [ "$i" -eq 30 ]; then echo "health 실패: ${body:-응답 없음}"; exit 1; fi
            sleep 5
          done

      # 선택 단계(check_image_bucket을 켠 때만): 버킷 연결 확인. 목록 조회 1회(GET, 쓰기 없음). 실패해도 배포 결과는 바꾸지 않고 오류 표시만 남겨요.
      - name: Check image bucket (optional, read-only)
        if: ${{ inputs.check_image_bucket }}
        continue-on-error: true
        env:
          KAKAO_S3_ACCESS_KEY: ${{ secrets.KAKAO_S3_ACCESS_KEY }}
          KAKAO_S3_SECRET_KEY: ${{ secrets.KAKAO_S3_SECRET_KEY }}
          IMAGE_S3_ENDPOINT: https://objectstorage.kr-central-2.kakaocloud.com
          IMAGE_S3_REGION: kr-central-2
          IMAGE_S3_BUCKET: live-obs-platform
        run: |
          set -euo pipefail
          ak="${KAKAO_S3_ACCESS_KEY:-}"; sk="${KAKAO_S3_SECRET_KEY:-}"
          [ -z "$ak" ] || echo "::add-mask::$ak"
          [ -z "$sk" ] || echo "::add-mask::$sk"
          if [ -z "$ak" ] || [ -z "$sk" ]; then
            echo "::warning::KAKAO_S3_* Secret이 비어 있어 버킷 확인을 건너뛰어요."; exit 0
          fi
          safe='^[A-Za-z0-9._/+=-]+$'
          [[ "$ak" =~ $safe && "$sk" =~ $safe ]] || { echo "::error::KAKAO_S3_* Secret 형식이 올바르지 않아 버킷 확인을 할 수 없어요."; exit 1; }
          out="$(mktemp)"; trap 'rm -f "$out"' EXIT
          empty_sha=e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855
          # 키는 인자가 아니라 표준입력의 curl 설정으로 넘겨요(프로세스 목록에 남지 않음). 경로 방식 주소(엔드포인트/버킷).
          code="$(printf 'user = "%s:%s"\n' "$ak" "$sk" | curl -sS -K - --max-time 20 -o "$out" -w '%{http_code}' \
            --aws-sigv4 "aws:amz:${IMAGE_S3_REGION}:s3" -H "x-amz-content-sha256: $empty_sha" \
            "${IMAGE_S3_ENDPOINT}/${IMAGE_S3_BUCKET}?list-type=2&max-keys=1" 2>/dev/null)" || code=000
          if [ "$code" = 200 ] && grep -q '<ListBucketResult' "$out"; then
            echo "버킷 연결 확인: 목록 조회 성공(HTTP 200, 쓰기 없음)"
          else
            err="$(grep -o '<Code>[^<]*</Code>' "$out" 2>/dev/null | head -n1 | sed 's/<[^>]*>//g' || true)"
            echo "::error::버킷 연결 확인 실패(HTTP $code${err:+, $err})"; exit 1
          fi

      - name: Record deploy
        if: success()
        run: |
          set -euo pipefail
          line="$(TZ=Asia/Seoul date '+%F %T KST') sha=$GITHUB_SHA run=$GITHUB_RUN_ID actor=$GITHUB_ACTOR"
          echo "$line" >> /opt/obs/deploy-history.log
          { echo "### obs-test 배포 완료"; echo; echo "- 커밋: \`$GITHUB_SHA\`"; echo "- 시각: $(TZ=Asia/Seoul date '+%F %T') KST"; } >> "$GITHUB_STEP_SUMMARY"

      # 배포가 성공한 뒤에만 오래된 백업·이미지·캐시·러너 로그를 정리한다. 정리가 실패해도 배포 결과는 바꾸지 않는다.
      - name: Clean up disk
        if: success()
        continue-on-error: true
        run: scripts/ops/disk-cleanup.sh --apply

      - name: Show status on failure
        if: failure()
        run: |
          docker compose -p obs-web -f deploy/docker-compose.yml --env-file "$ENV_FILE" ps || true
          docker compose -p obs-web -f deploy/docker-compose.yml --env-file "$ENV_FILE" logs --tail 80 obs-web-migrate obs-web-app || true

      # 성공·실패·취소 어느 쪽이든 같은 키의 표시를 끈다. 이 단계가 실패해도 배포 결과는 바꾸지 않는다.
      - name: Unmark deploying (monitor)
        if: always()
        env:
          MARK_KEY: workflow-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          if command -v flock >/dev/null 2>&1 && [ -x scripts/ops/deploy-mark.sh ]; then
            scripts/ops/deploy-mark.sh off "$MARK_KEY" || echo "::warning::배포 진행 표시를 끄지 못했어요. 표시는 만료 시각(기본 1시간)에 저절로 풀려요."
          fi

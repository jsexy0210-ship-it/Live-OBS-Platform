# 이 기존 VM 안의 테스트 PostgreSQL만 사용한다. Managed DB를 생성하지 않는다.
name: obs-web

x-app-env: &app-env
  DATABASE_URL: postgresql://${POSTGRES_USER:?}:${POSTGRES_PASSWORD:?}@obs-web-db:5432/${POSTGRES_DB:?}?connect_timeout=3&pool_timeout=3

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  obs-web-db:
    image: postgres:16
    restart: unless-stopped
    logging: *logging
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      POSTGRES_DB: ${POSTGRES_DB:?}
      TZ: Asia/Seoul
    volumes:
      - obs-web-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 5s
      timeout: 5s
      retries: 20

  obs-web-migrate:
    image: obs-web-migrate:${APP_VERSION:?}
    build:
      context: ..
      dockerfile: Dockerfile
      target: migrator
    environment: *app-env
    logging: *logging
    restart: "no"

  obs-web-app:
    image: obs-web-app:${APP_VERSION:?}
    build:
      context: ..
      dockerfile: Dockerfile
      target: runner
      args:
        APP_VERSION: ${APP_VERSION:?}
    restart: unless-stopped
    logging: *logging
    # 런타임 허용 목록만 주입. 서버 파일을 통째로 전달하지 않는다.
    environment:
      <<: *app-env
      TRUSTED_PROXY_HOPS: "1"
      OBS_ENFORCE_HOST_POLICY: "1"
      OBS_ALLOWED_HOSTS: "on-aircue.com"
      IDENTITY_HASH_KEY: ${IDENTITY_HASH_KEY:?}
      BILLING_KEY_SECRET: ${BILLING_KEY_SECRET:?}
      BILLING_PROVIDER: ""
      BUSINESS_STATUS_PROVIDER: ""
      MAIL_ORDER_PROVIDER: ""
    expose:
      - "3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health',{signal:AbortSignal.timeout(4000)}).then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      start_period: 20s
      retries: 12

  obs-web-proxy:
    image: caddy:2
    restart: unless-stopped
    logging: *logging
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ${OBS_CADDY_FILE:-./Caddyfile}:/etc/caddy/Caddyfile:ro
      - obs-web-caddy-data:/data
      - obs-web-caddy-config:/config

volumes:
  obs-web-pgdata:
  obs-web-caddy-data:
  obs-web-caddy-config:
